<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard & Turni - Roster Planner</title>
    <!-- Stili Condivisi e Specifici -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="brand">
            <i class="fa-solid fa-calendar-check"></i>
            <h2>Roster Planner</h2>
        </div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-item active">
                <i class="fa-solid fa-house"></i> Dashboard & Turni
            </a>
            <a href="shiftTemplates.html" class="nav-item">
                <i class="fa-solid fa-clock"></i> Template Turni
            </a>
            <a href="employees.html" class="nav-item">
                <i class="fa-solid fa-users"></i> Gestione Dipendenti
            </a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <header class="page-header">
            <h1>Pianificazione Turni</h1>
            <div id="solver-status-badge" class="badge status-idle">Status: Inattivo</div>
        </header>

        <!-- Pannello di Controllo Algoritmo -->
        <div class="card control-panel">
            <h3><i class="fa-solid fa-sliders"></i> Operazioni Generazione & Ottimizzazione</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="startDate">Data Inizio:</label>
                    <input type="date" id="startDate" class="form-control">
                </div>
                <div class="form-group">
                    <label for="endDate">Data Fine:</label>
                    <input type="date" id="endDate" class="form-control">
                </div>
                <div class="button-group">
                    <button class="btn btn-secondary" onclick="generateShifts()">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> 1. Genera Turni
                    </button>
                    <button class="btn btn-primary" onclick="startSolver()">
                        <i class="fa-solid fa-play"></i> 2. Avvia Solver
                    </button>
                    <button class="btn btn-danger" onclick="stopSolver()">
                        <i class="fa-solid fa-stop"></i> Ferma Solver
                    </button>
                </div>
            </div>
        </div>

        <!-- Griglia Calendario Turni -->
        <div class="card">
            <h3><i class="fa-solid fa-calendar-days"></i> Palinsesto Turni Assegnati</h3>
            <div id="calendar-grid" class="calendar-container">
                <p class="placeholder-text">Seleziona un intervallo di date e genera i turni per visualizzare la
                    griglia.</p>
            </div>
        </div>
    </main>
</div>

<!-- Script JavaScript per la Dashboard -->
<script src="js/app.js"></script>
</body>
</html>
