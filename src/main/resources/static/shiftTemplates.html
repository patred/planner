<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Turni - Roster Planner</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/shiftTemplates.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="brand">
            <i class="fa-solid fa-calendar-check"></i>
            <h2>Roster Planner</h2>
        </div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-item">
                <i class="fa-solid fa-house"></i> Dashboard & Turni
            </a>
            <a href="shiftTemplates.html" class="nav-item active">
                <i class="fa-solid fa-clock"></i> Template Turni
            </a>
            <a href="employees.html" class="nav-item">
                <i class="fa-solid fa-users"></i> Gestione Dipendenti
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="page-header">
            <h1>Configurazione Modelli Turno</h1>
            <button class="btn btn-primary" onclick="openModal()">
                <i class="fa-solid fa-plus"></i> Nuovo Template
            </button>
        </header>

        <div class="card">
            <table class="data-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome Turno</th>
                    <th>Orario Inizio</th>
                    <th>Orario Fine</th>
                    <th>Fabbisogno Ruoli (Map)</th>
                    <th>Azioni</th>
                </tr>
                </thead>
                <tbody id="templates-table-body">
                <!-- Popolato via JS -->
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Modale Inserimento Template -->
<div id="template-modal" class="modal-backdrop">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Crea Nuovo Template</h3>
            <button class="btn-close" onclick="closeModal()">&times;</button>
        </div>
        <form id="template-form" onsubmit="saveTemplate(event)">
            <div class="form-group">
                <label for="tpl-name">Nome Turno</label>
                <input type="text" id="tpl-name" class="form-control" placeholder="es. Mattina, Notte" required>
            </div>
            <div class="form-row-2">
                <div class="form-group">
                    <label for="tpl-start">Orario Inizio</label>
                    <input type="time" id="tpl-start" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="tpl-end">Orario Fine</label>
                    <input type="time" id="tpl-end" class="form-control" required>
                </div>
            </div>

            <div class="requirements-section">
                <h4>Fabbisogno Personale per Ruolo</h4>
                <div id="role-requirements-list">
                    <!-- Generato dinamicamente con gli input per ogni Ruolo nel DB -->
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Annulla</button>
                <button type="submit" class="btn btn-primary">Salva Template</button>
            </div>
        </form>
    </div>
</div>

<script src="js/shiftTemplates.js"></script>
</body>
</html>
