<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Turni - Roster Planner</title>
    <!-- Stili Condivisi e Specifici -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/shiftTemplates.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div class="brand">
            <i class="fa-solid fa-calendar-check"></i>
            <h2>Roster Planner</h2>
        </div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-item">
                <i class="fa-solid fa-house"></i> Dashboard & Turni
            </a>
            <a href="shiftTemplates.html" class="nav-item active">
                <i class="fa-solid fa-clock"></i> Template Turni
            </a>
            <a href="employees.html" class="nav-item">
                <i class="fa-solid fa-users"></i> Gestione Dipendenti
            </a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <header class="page-header">
            <h1>Template Turni</h1>
            <button class="btn btn-primary" onclick="openModal()">
                <i class="fa-solid fa-plus"></i> Nuovo Template
            </button>
        </header>

        <div class="card">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Sigla / Nome</th>
                    <th>Orario</th>
                    <th>Applicabilità Giorni</th>
                    <th>Fabbisogno</th>
                    <th>Azioni</th>
                </tr>
                </thead>
                <tbody id="templates-table-body">
                <!-- Popolato via Javascript -->
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Modal Form Template Turno -->
<div id="template-modal" class="modal">
    <div class="modal-content card">
        <div class="modal-header">
            <h2 id="modal-title">Nuovo Template Turno</h2>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <form id="template-form" onsubmit="saveTemplate(event)">
            <input type="hidden" id="template-id">

            <div class="form-row">
                <div class="form-group flex-2">
                    <label for="tpl-name">Nome Completo:</label>
                    <input type="text" id="tpl-name" class="form-control" placeholder="es. Notte Reparto" required>
                </div>
                <div class="form-group flex-1">
                    <label for="tpl-shortName">Nome Breve:</label>
                    <input type="text" id="tpl-shortName" class="form-control" placeholder="es. Notte">
                </div>
                <div class="form-group flex-1">
                    <label for="tpl-acronym">Acronimo:</label>
                    <input type="text" id="tpl-acronym" class="form-control" placeholder="es. N" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group flex-1">
                    <label for="tpl-startTime">Ora Inizio:</label>
                    <input type="time" id="tpl-startTime" class="form-control" required>
                </div>
                <div class="form-group flex-1">
                    <label for="tpl-endTime">Ora Fine:</label>
                    <input type="time" id="tpl-endTime" class="form-control" required>
                </div>
            </div>

            <!-- Checkboxes per i Giorni e Notturno -->
            <div class="form-group">
                <label>Applicazione e Tipologia:</label>
                <div class="checkbox-grid">
                    <label class="checkbox-label">
                        <input type="checkbox" id="tpl-onWeekdays" checked> Feriali (Lun-Ven)
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="tpl-onSaturday"> Sabato
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="tpl-onSunday"> Domenica
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="tpl-onHolidays"> Festivi
                    </label>
                    <label class="checkbox-label highlight">
                        <input type="checkbox" id="tpl-nightShift"> Turno Notturno
                    </label>
                </div>
            </div>

            <!-- Sezione Fabbisogno Personale (Dinamica) -->
            <div class="form-group" style="margin-top: 15px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label style="font-weight: 600; font-size: 0.9rem; color: #334155; margin: 0;">
                        Fabbisogno Personale (Regole Gruppo Ruoli)
                    </label>
                    <button type="button" class="btn btn-secondary" id="btn-add-requirement-rule" style="padding: 4px 10px; font-size: 0.8rem;">
                        + Aggiungi Regola
                    </button>
                </div>

                <div id="requirements-rules-container" style="display: flex; flex-direction: column; gap: 10px; max-height: 220px; overflow-y: auto; padding-right: 4px;">
                    <!-- Le regole di fabbisogno verranno inserite qui dinamicamente -->
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Annulla</button>
                <button type="submit" class="btn btn-primary">Salva Template</button>
            </div>
        </form>
    </div>
</div>

<script src="js/shiftTemplates.js"></script>
</body>
</html>
