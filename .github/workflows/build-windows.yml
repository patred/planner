name: Build Windows Exe Installer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Permette di avviare la build manualmente dalla scheda Actions di GitHub

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Scarica il codice sorgente dal repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura JDK 21 (Temurin) e la cache di Maven per velocizzare le build
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Compila il progetto e crea il file JAR eseguibile
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Prepara la struttura di input per jpackage
      - name: Prepare jpackage input directory
        run: |
          mkdir jpackage-input
          copy target\*.jar jpackage-input\app.jar

      # 5. Genera l'installer Windows .exe tramite jpackage
      - name: Generate Windows .exe installer with jpackage
        run: |
          jpackage `
            --type exe `
            --name "GestioneTurni" `
            --app-version "1.0.0" `
            --description "Applicazione desktop per la pianificazione automatica dei turni" `
            --vendor "PatRed Planner" `
            --input jpackage-input `
            --main-jar app.jar `
            --dest dist `
            --win-shortcut `
            --win-menu `
            --win-dir-chooser

      # 6. Carica l'installer .exe generato tra gli Artifacts scaricabili della build
      - name: Upload Installer Executable
        uses: actions/upload-artifact@v4
        with:
          name: GestioneTurni-Windows-Installer
          path: dist/*.exe