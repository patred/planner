name: Build All Distributions (Windows & Linux)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ========================================================
  # 1. BUILD WINDOWS (Installer .exe + Portable .zip)
  # ========================================================
  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Prepare jpackage input directory
        run: |
          mkdir jpackage-input
          copy target\*.jar jpackage-input\shift-manager.jar

      # --- A. Generazione PORTABLE (.zip) ---
      - name: Generate Portable Windows App (app-image)
        run: |
          jpackage `
            --type app-image `
            --name "ShiftManager" `
            --app-version "1.0.0" `
            --description "Applicazione desktop per la pianificazione automatica dei turni" `
            --vendor "PatRed Planner" `
            --input jpackage-input `
            --main-jar shift-manager.jar `
            --dest dist-portable

      - name: Compress Portable App
        run: Compress-Archive -Path "dist-portable\ShiftManager\*" -DestinationPath "dist-portable\ShiftManager-Windows-Portable.zip"

      # --- B. Generazione INSTALLER (.exe) ---
      - name: Generate Windows .exe installer
        run: |
          jpackage `
            --type exe `
            --name "ShiftManager" `
            --app-version "1.0.0" `
            --description "Applicazione desktop per la pianificazione automatica dei turni" `
            --vendor "PatRed Planner" `
            --input jpackage-input `
            --main-jar shift-manager.jar `
            --dest dist-installer `
            --win-shortcut `
            --win-menu `
            --win-dir-chooser

      # --- Upload Artifacts Windows ---
      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftManager-Windows-Portable
          path: dist-portable/ShiftManager-Windows-Portable.zip

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftManager-Windows-Installer
          path: dist-installer/*.exe


  # ========================================================
  # 2. BUILD LINUX (Ubuntu / Debian .deb)
  # ========================================================
  build-linux:
    name: Build Linux Package (.deb)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install jpackage dependencies (fakeroot, dpkg-dev)
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg-dev

      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      - name: Prepare jpackage input directory
        run: |
          mkdir jpackage-input
          cp target/*.jar jpackage-input/shift-manager.jar

      # --- Generazione pacchetto .deb ---
      - name: Generate Linux .deb Package
        run: |
          jpackage \
            --type deb \
            --name "shift-manager" \
            --app-version "1.0.0" \
            --description "Applicazione desktop per la pianificazione automatica dei turni" \
            --vendor "PatRed Planner" \
            --input jpackage-input \
            --main-jar shift-manager.jar \
            --dest dist-linux \
            --linux-shortcut

      # --- Upload Artifact Linux ---
      - name: Upload Linux Debian/Ubuntu Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftManager-Linux-Debian
          path: dist-linux/*.deb